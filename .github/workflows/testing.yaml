name: Run Code Tests

on:
  pull_request:
    branches:
      - '**'

  workflow_dispatch:
    inputs:
      HDB_VERSION:
        description: Harper Version (latest, 4.6.1, etc)
        type: string
        required: true
        default: latest
      NODE_VERSION:
        description: Node.js Version (lts/*, 18, 20, etc)
        type: string
        required: true
        default: lts/*

jobs:
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load Node.js version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            source .github/config/versions.txt
            echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
          else
            echo "NODE_VERSION=${{ github.event.inputs.NODE_VERSION }}" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Run unit tests
        shell: bash
        run: npm run test:unit

  check-performance-tests:
    name: Run Performance Test Checks
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for K6 setup
        shell: bash
        run: |
          chmod +x .github/scripts/check_k6_setup.sh
          ./.github/scripts/check_k6_setup.sh tests/performance

  # NOTE: Integration tests run in the dedicated `integration-tests.yml` workflow, which uses the
  # `@harperfast/integration-testing` harness to start Harper v5 in-process (no Docker image needed).
  # The old Docker-based integration job that lived here was removed: Harper v5 is not published as a
  # `harperdb/harperdb` Docker image, so `docker run harperdb/harperdb:<v5>` failed with a manifest
  # error. See integration-tests.yml for the current, harness-based integration test job.
